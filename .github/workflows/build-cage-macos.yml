name: Build Cage macOS test app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit SHA to build
        required: true
        type: string
      artifact_name:
        description: Artifact name
        required: false
        default: cage-macos-arm64-test
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the exact source and Apple Silicon runner
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Pass an exact commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run focused gate regression tests
        run: go test ./internal/cage -run 'TestProxyRevision' -count=1
      - name: Run focused native component maintenance tests
        run: python3 scripts/guest-os/tests/native-maintenance.py NativeMaintenance.test_ad_hoc_components_can_migrate_a_signed_installation NativeMaintenance.test_a_different_signing_team_cannot_replace_installed_components NativeMaintenance.test_compositor_filter_is_not_limited_to_intel_macs
      - name: Run maintenance compositor tests
        run: |
          check=$(mktemp -d "$RUNNER_TEMP/cage-maintenance.XXXXXX")
          xcrun swiftc -parse-as-library -O scripts/guest-os/macos-maintenance-compositor.swift scripts/guest-os/tests/macos-maintenance-compositor-test.swift -o "$check/maintenance-test"
          "$check/maintenance-test"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install SSHFS build dependencies
        run: |
          brew install glib gettext pcre2
          brew upgrade glib gettext pcre2
      - name: Build the macOS application without release credentials
        env:
          CAGE_SIGNING_IDENTITY: '-'
        run: bash scripts/build-app.sh
      - name: Verify the application bundle
        run: |
          codesign --verify --deep --strict _output/Cage.app
          _output/Cage.app/Contents/Resources/cage --help
          _output/Cage.app/Contents/Resources/mihomo -v
          [[ "$(lipo -archs _output/Cage.app/Contents/MacOS/Cage)" == arm64 ]]
      - name: Archive a complete development App
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p _output/ci-macos-test
          archive="$PWD/_output/ci-macos-test/Cage-$version-macos-arm64-test.tar.gz"
          tar -czf "$archive" -C _output Cage.app
          check=$(mktemp -d "$RUNNER_TEMP/cage-app-archive.XXXXXX")
          trap 'rm -rf "$check"' EXIT
          tar -xzf "$archive" -C "$check"
          codesign --verify --deep --strict "$check/Cage.app"
          for executable in Contents/MacOS/Cage Contents/Resources/cage Contents/Resources/mihomo Contents/Resources/CageUpdateInstaller; do
            test -x "$check/Cage.app/$executable"
          done
          (cd _output/ci-macos-test && shasum -a 256 "${archive##*/}" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/ci-macos-test/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
